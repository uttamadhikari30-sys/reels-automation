name: Reels Auto-Post

on:
  workflow_dispatch:
    inputs:
      brand:
        description: "brand (factmitra / arogyamantra / sparkmind)"
        required: true
        default: "arogyamantra"
      slot:
        description: "slot HH:MM (e.g. 11:00)"
        required: true
        default: "11:00"
      no_post:
        description: "render only (true/false)"
        required: false
        default: "false"
  schedule:
    # times are UTC. IST = UTC + 5:30
    - cron: "30 0 * * *"   # sparkmind 06:00
    - cron: "30 3 * * *"   # sparkmind 09:00
    - cron: "30 4 * * *"   # factmitra 10:00
    - cron: "30 5 * * *"   # arogyamantra 11:00
    - cron: "30 6 * * *"   # factmitra 12:00
    - cron: "33 6 * * *"   # sparkmind 12:00
    - cron: "30 7 * * *"   # arogyamantra 13:00
    - cron: "30 8 * * *"   # factmitra 14:00
    - cron: "30 9 * * *"   # sparkmind 15:00
    - cron: "30 10 * * *"  # arogyamantra 16:00
    - cron: "30 11 * * *"  # factmitra 17:00
    - cron: "30 12 * * *"  # sparkmind 18:00
    - cron: "30 13 * * *"  # factmitra 19:00
    - cron: "30 14 * * *"  # arogyamantra 20:00

permissions:
  contents: write   # to commit never-repeat state back

concurrency:
  group: reels
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg + font + deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          mkdir -p assets state
          curl -sL -o assets/NotoSansDevanagari.ttf \
            https://github.com/google/fonts/raw/main/ofl/mukta/Mukta-Regular.ttf
          # register Devanagari font with fontconfig so libass shapes Hindi correctly
          sudo mkdir -p /usr/share/fonts/truetype/mukta
          sudo cp assets/NotoSansDevanagari.ttf /usr/share/fonts/truetype/mukta/Mukta-Regular.ttf
          sudo fc-cache -f >/dev/null 2>&1 || true
          # royalty-free background music (Kevin MacLeod, CC BY 4.0) — render picks one at random
          mkdir -p assets/music
          MB="https://incompetech.com/music/royalty-free/mp3-royaltyfree"
          for n in "Peaceful%20Desolation" "Meditation%20Impromptu%2001" "Deliberate%20Thought" "Inspired"; do
            curl -sL -o "assets/music/$(echo $n | sed 's/%20/_/g').mp3" "$MB/$n.mp3" || true
          done
          pip install -r requirements.txt

      - name: Pick brand + slot
        id: pick
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          # workflow_dispatch inputs take priority; else map the cron that fired
          b = os.environ.get("IN_BRAND"); s = os.environ.get("IN_SLOT")
          npost = os.environ.get("IN_NOPOST","false")
          cron = os.environ.get("CRON","")
          M = {
            "30 0 * * *": ("sparkmind","06:00"),   "30 3 * * *": ("sparkmind","09:00"),
            "30 4 * * *": ("factmitra","10:00"),   "30 5 * * *": ("arogyamantra","11:00"),
            "30 6 * * *": ("factmitra","12:00"),   "33 6 * * *": ("sparkmind","12:00"),
            "30 7 * * *": ("arogyamantra","13:00"),"30 8 * * *": ("factmitra","14:00"),
            "30 9 * * *": ("sparkmind","15:00"),   "30 10 * * *": ("arogyamantra","16:00"),
            "30 11 * * *": ("factmitra","17:00"),  "30 12 * * *": ("sparkmind","18:00"),
            "30 13 * * *": ("factmitra","19:00"),  "30 14 * * *": ("arogyamantra","20:00"),
          }
          if not (b and s) and cron in M:
            b, s = M[cron]
          pres = ""
          try:
            import json
            bs = json.load(open("brands.json", encoding="utf-8"))
            pres = bs.get(b, {}).get("slots", {}).get(s, {}).get("presenter", "") or ""
          except Exception:
            pres = ""
          print(f"brand={b}")
          print(f"slot={s}")
          print(f"no_post={npost}")
          print(f"presenter={pres}")
          PY
        env:
          IN_BRAND: ${{ github.event.inputs.brand }}
          IN_SLOT: ${{ github.event.inputs.slot }}
          IN_NOPOST: ${{ github.event.inputs.no_post }}
          CRON: ${{ github.event.schedule }}

      # Talking presenter (free, CPU). Only for slots that have a presenter (dadi/nani).
      # Non-fatal: if anything here fails, the reel still renders with the still presenter.
      - name: Set up talking presenter (Wav2Lip)
        if: steps.pick.outputs.presenter != ''
        continue-on-error: true
        run: |
          pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet opencv-python librosa numba scipy tqdm
          git clone --depth 1 https://github.com/Rudrabha/Wav2Lip.git wav2lip
          mkdir -p wav2lip/checkpoints wav2lip/face_detection/detection/sfd
          curl -sL -o wav2lip/checkpoints/wav2lip_gan.pth \
            https://huggingface.co/camenduru/Wav2Lip/resolve/main/checkpoints/wav2lip_gan.pth
          curl -sL -o wav2lip/face_detection/detection/sfd/s3fd.pth \
            https://huggingface.co/camenduru/Wav2Lip/resolve/main/face_detection/detection/sfd/s3fd.pth
          # modern librosa needs keyword args for the mel filter
          sed -i 's/return librosa.filters.mel(hp.sample_rate, hp.n_fft, n_mels=hp.num_mels,/return librosa.filters.mel(sr=hp.sample_rate, n_fft=hp.n_fft, n_mels=hp.num_mels,/' wav2lip/audio.py
          echo "wav2lip set up for presenter=${{ steps.pick.outputs.presenter }}"

      - name: Generate + render + post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          FLAG=""
          if [ "${{ steps.pick.outputs.no_post }}" = "true" ]; then FLAG="--no-post"; fi
          python pipeline.py --brand "${{ steps.pick.outputs.brand }}" --slot "${{ steps.pick.outputs.slot }}" $FLAG

      - name: Upload rendered reel (for preview)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ steps.pick.outputs.brand }}-${{ github.run_number }}
          path: reel.mp4
          if-no-files-found: ignore

      - name: Save never-repeat state
        if: ${{ steps.pick.outputs.no_post != 'true' }}
        run: |
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          git add state/ || true
          git commit -m "state: ${{ steps.pick.outputs.brand }} ${{ steps.pick.outputs.slot }}" || echo "no state change"
          git push || echo "nothing to push"
